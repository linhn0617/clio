name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        # -timeout 20m: under -race the ingest package took 389s (Go 1.27) and 278s (Go 1.26)
        # in CI run 42358286981 (2026-11-07); Go's per-binary default of 10m left little room.
        run: go test -race -timeout 20m ./...

  # The minimum Go in go.mod, kept apart so the required "test" check keeps its name.
  test-go1_26:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        # -timeout 20m: under -race the ingest package took 389s (Go 1.27) and 278s (Go 1.26)
        # in CI run 42358286981 (2026-11-07); Go's per-binary default of 10m left little room.
        run: go test -race -timeout 20m ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
